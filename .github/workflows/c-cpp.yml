name: C Q&A CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-check:
    name: Compile all C files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Show GCC version
        run: gcc --version

      - name: Find and compile all .c files
        run: |
          set -e
          PASS=0
          FAIL=0
          ERRORS=""

          while IFS= read -r file; do
            echo "Compiling: $file"
            if gcc -std=c11 -Wall -Wextra -pedantic -o /dev/null "$file" 2>&1; then
              PASS=$((PASS + 1))
            else
              FAIL=$((FAIL + 1))
              ERRORS="$ERRORS\n  - $file"
            fi
          done < <(find . -name "*.c" | sort)

          echo ""
          echo "==============================="
          echo "  Results: $PASS passed, $FAIL failed"
          echo "==============================="

          if [ "$FAIL" -gt 0 ]; then
            echo -e "Files that failed to compile:$ERRORS"
            exit 1
          fi

      - name: Check for files missing a main() function
        run: |
          echo "Checking for standalone programs (files with main)..."
          find . -name "*.c" | sort | while read -r file; do
            if grep -q "int main" "$file"; then
              echo "  [main found] $file"
            else
              echo "  [no main]   $file (likely a snippet — skipping link check)"
            fi
          done

      - name: Lint check with cppcheck (static analysis)
        run: |
          sudo apt-get install -y cppcheck
          cppcheck --enable=warning,style,performance \
                   --std=c11 \
                   --error-exitcode=0 \
                   --quiet \
                   $(find . -name "*.c" | tr '\n' ' ')
